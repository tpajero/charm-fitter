[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "charm_fitter"
version = "0.1.0"
description = "Plotting utils for CharmFitter"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
charm_fitter = ["styles/*.mplstyle"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E7",
    "E9",
    "E101",
    "W1",
    "W6",
    # isort
    "I001"
]
ignore = [
    "E741", # Ambiguous variable name
]
